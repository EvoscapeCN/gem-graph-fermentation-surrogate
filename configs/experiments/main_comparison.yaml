# main comparison table / run-level contrasts / tail-risk statistics: 5 folds x 5 seeds per method.
# Ridge is deterministic and run once; seed = model seed + fold.
shared:
  n_folds: 5
  rate_clip_max: 5.0
  monotonicity_tolerance: 0.0
  loss_type: RMSE
  readouts_to_aggregate: [biomass_rate, o2_consumption_rate, sugar_consumption_rate, carotenoids_rate, astaxanthin_rate]
  readout_to_target_mapping: {biomass_rate: interpolated_biomass, o2_consumption_rate: cumulated_o2_consumption, sugar_consumption_rate: cumulated_sugar_consumption,
    carotenoids_rate: carotenoids, astaxanthin_rate: astaxanthin}
  specific_rate_readouts: [o2_consumption_rate, sugar_consumption_rate, carotenoids_rate, astaxanthin_rate]
  biomass_readout: biomass_rate
  biomass_target: interpolated_biomass
main_comparison:
  specific_rate_use_measured_biomass: false
  methods:
    main_seed42: {type: gnn, seed: 42, config_path: configs/finetune_main.yaml}
    main_seed43: {type: gnn, seed: 43, config_path: configs/finetune_main.yaml}
    main_seed44: {type: gnn, seed: 44, config_path: configs/finetune_main.yaml}
    main_seed45: {type: gnn, seed: 45, config_path: configs/finetune_main.yaml}
    main_seed46: {type: gnn, seed: 46, config_path: configs/finetune_main.yaml}
    gnn_seed42: {type: gnn, seed: 42, config_path: configs/ablations/no_biomass_head.yaml}
    gnn_seed43: {type: gnn, seed: 43, config_path: configs/ablations/no_biomass_head.yaml}
    gnn_seed44: {type: gnn, seed: 44, config_path: configs/ablations/no_biomass_head.yaml}
    gnn_seed45: {type: gnn, seed: 45, config_path: configs/ablations/no_biomass_head.yaml}
    gnn_seed46: {type: gnn, seed: 46, config_path: configs/ablations/no_biomass_head.yaml}
    ridge_seed42: {type: flat_ml, model: ridge, target_mode: specific, seed: 42, config_path: configs/finetune_main.yaml}
    xgb_seed42: {type: flat_ml, model: xgboost, target_mode: specific, seed: 42, config_path: configs/finetune_main.yaml}
    xgb_seed43: {type: flat_ml, model: xgboost, target_mode: specific, seed: 43, config_path: configs/finetune_main.yaml}
    xgb_seed44: {type: flat_ml, model: xgboost, target_mode: specific, seed: 44, config_path: configs/finetune_main.yaml}
    xgb_seed45: {type: flat_ml, model: xgboost, target_mode: specific, seed: 45, config_path: configs/finetune_main.yaml}
    xgb_seed46: {type: flat_ml, model: xgboost, target_mode: specific, seed: 46, config_path: configs/finetune_main.yaml}
