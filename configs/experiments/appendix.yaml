# Appendix variants: FiLM, reuse of the pretraining flux projection, causal temporal kernels.
shared:
  n_folds: 5
  rate_clip_max: 5.0
  monotonicity_tolerance: 0.0
  loss_type: RMSE
  readouts_to_aggregate: [biomass_rate, o2_consumption_rate, sugar_consumption_rate, carotenoids_rate, astaxanthin_rate]
  readout_to_target_mapping: {biomass_rate: interpolated_biomass, o2_consumption_rate: cumulated_o2_consumption, sugar_consumption_rate: cumulated_sugar_consumption,
    carotenoids_rate: carotenoids, astaxanthin_rate: astaxanthin}
  specific_rate_readouts: [o2_consumption_rate, sugar_consumption_rate, carotenoids_rate, astaxanthin_rate]
  biomass_readout: biomass_rate
  biomass_target: interpolated_biomass
appendix:
  specific_rate_use_measured_biomass: false
  methods:
    with_film_seed42: {type: gnn, seed: 42, config_path: configs/appendix/with_film.yaml}
    with_film_seed43: {type: gnn, seed: 43, config_path: configs/appendix/with_film.yaml}
    with_film_seed44: {type: gnn, seed: 44, config_path: configs/appendix/with_film.yaml}
    with_film_seed45: {type: gnn, seed: 45, config_path: configs/appendix/with_film.yaml}
    with_film_seed46: {type: gnn, seed: 46, config_path: configs/appendix/with_film.yaml}
    reuse_flux_proj_seed42: {type: gnn, seed: 42, config_path: configs/appendix/reuse_flux_proj.yaml}
    reuse_flux_proj_seed43: {type: gnn, seed: 43, config_path: configs/appendix/reuse_flux_proj.yaml}
    reuse_flux_proj_seed44: {type: gnn, seed: 44, config_path: configs/appendix/reuse_flux_proj.yaml}
    reuse_flux_proj_seed45: {type: gnn, seed: 45, config_path: configs/appendix/reuse_flux_proj.yaml}
    reuse_flux_proj_seed46: {type: gnn, seed: 46, config_path: configs/appendix/reuse_flux_proj.yaml}
    causal_kernel_seed42: {type: gnn, seed: 42, config_path: configs/appendix/causal_kernel.yaml}
    causal_kernel_seed43: {type: gnn, seed: 43, config_path: configs/appendix/causal_kernel.yaml}
    causal_kernel_seed44: {type: gnn, seed: 44, config_path: configs/appendix/causal_kernel.yaml}
    causal_kernel_seed45: {type: gnn, seed: 45, config_path: configs/appendix/causal_kernel.yaml}
    causal_kernel_seed46: {type: gnn, seed: 46, config_path: configs/appendix/causal_kernel.yaml}
