# Structural randomisation controls; the randomisation seed is an offset plus the model seed.
shared:
  n_folds: 5
  rate_clip_max: 5.0
  monotonicity_tolerance: 0.0
  loss_type: RMSE
  readouts_to_aggregate: [biomass_rate, o2_consumption_rate, sugar_consumption_rate, carotenoids_rate, astaxanthin_rate]
  readout_to_target_mapping: {biomass_rate: interpolated_biomass, o2_consumption_rate: cumulated_o2_consumption, sugar_consumption_rate: cumulated_sugar_consumption,
    carotenoids_rate: carotenoids, astaxanthin_rate: astaxanthin}
  specific_rate_readouts: [o2_consumption_rate, sugar_consumption_rate, carotenoids_rate, astaxanthin_rate]
  biomass_readout: biomass_rate
  biomass_target: interpolated_biomass
controls:
  specific_rate_use_measured_biomass: false
  methods:
    edge_shuffle_seed42:
      type: gnn
      seed: 42
      config_path: configs/controls/edge_shuffle.yaml
      config_overrides: {dataset.graph_edge_shuffle_seed: 1042}
    edge_shuffle_seed43:
      type: gnn
      seed: 43
      config_path: configs/controls/edge_shuffle.yaml
      config_overrides: {dataset.graph_edge_shuffle_seed: 1043}
    edge_shuffle_seed44:
      type: gnn
      seed: 44
      config_path: configs/controls/edge_shuffle.yaml
      config_overrides: {dataset.graph_edge_shuffle_seed: 1044}
    edge_shuffle_seed45:
      type: gnn
      seed: 45
      config_path: configs/controls/edge_shuffle.yaml
      config_overrides: {dataset.graph_edge_shuffle_seed: 1045}
    edge_shuffle_seed46:
      type: gnn
      seed: 46
      config_path: configs/controls/edge_shuffle.yaml
      config_overrides: {dataset.graph_edge_shuffle_seed: 1046}
    random_edges_seed42:
      type: gnn
      seed: 42
      config_path: configs/controls/random_edges.yaml
      config_overrides: {dataset.graph_random_edges_seed: 3042}
    random_edges_seed43:
      type: gnn
      seed: 43
      config_path: configs/controls/random_edges.yaml
      config_overrides: {dataset.graph_random_edges_seed: 3043}
    random_edges_seed44:
      type: gnn
      seed: 44
      config_path: configs/controls/random_edges.yaml
      config_overrides: {dataset.graph_random_edges_seed: 3044}
    random_edges_seed45:
      type: gnn
      seed: 45
      config_path: configs/controls/random_edges.yaml
      config_overrides: {dataset.graph_random_edges_seed: 3045}
    random_edges_seed46:
      type: gnn
      seed: 46
      config_path: configs/controls/random_edges.yaml
      config_overrides: {dataset.graph_random_edges_seed: 3046}
    metabolite_shuffle_seed42: {type: gnn, seed: 42, config_path: configs/controls/metabolite_shuffle.yaml}
    metabolite_shuffle_seed43: {type: gnn, seed: 43, config_path: configs/controls/metabolite_shuffle.yaml}
    metabolite_shuffle_seed44: {type: gnn, seed: 44, config_path: configs/controls/metabolite_shuffle.yaml}
    metabolite_shuffle_seed45: {type: gnn, seed: 45, config_path: configs/controls/metabolite_shuffle.yaml}
    metabolite_shuffle_seed46: {type: gnn, seed: 46, config_path: configs/controls/metabolite_shuffle.yaml}
    gpr_shuffle_seed42:
      type: gnn
      seed: 42
      config_path: configs/controls/gpr_shuffle.yaml
      config_overrides: {dataset.gpr_shuffle_seed: 2042}
    gpr_shuffle_seed43:
      type: gnn
      seed: 43
      config_path: configs/controls/gpr_shuffle.yaml
      config_overrides: {dataset.gpr_shuffle_seed: 2043}
    gpr_shuffle_seed44:
      type: gnn
      seed: 44
      config_path: configs/controls/gpr_shuffle.yaml
      config_overrides: {dataset.gpr_shuffle_seed: 2044}
    gpr_shuffle_seed45:
      type: gnn
      seed: 45
      config_path: configs/controls/gpr_shuffle.yaml
      config_overrides: {dataset.gpr_shuffle_seed: 2045}
    gpr_shuffle_seed46:
      type: gnn
      seed: 46
      config_path: configs/controls/gpr_shuffle.yaml
      config_overrides: {dataset.gpr_shuffle_seed: 2046}
    no_prior_both_paths_seed42:
      type: gnn
      seed: 42
      config_path: configs/controls/no_prior_both_paths.yaml
      config_overrides: {dataset.graph_random_edges_seed: 3042, dataset.metabolite_randomize_seed: 5042}
    no_prior_both_paths_seed43:
      type: gnn
      seed: 43
      config_path: configs/controls/no_prior_both_paths.yaml
      config_overrides: {dataset.graph_random_edges_seed: 3043, dataset.metabolite_randomize_seed: 5043}
    no_prior_both_paths_seed44:
      type: gnn
      seed: 44
      config_path: configs/controls/no_prior_both_paths.yaml
      config_overrides: {dataset.graph_random_edges_seed: 3044, dataset.metabolite_randomize_seed: 5044}
