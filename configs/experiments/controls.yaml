      seed: 45
      config_path: configs/controls/no_prior_both_paths.yaml
      config_overrides: {dataset.graph_random_edges_seed: 3045, dataset.metabolite_randomize_seed: 5045}
    no_prior_both_paths_seed46:
      type: gnn
      seed: 46
      config_path: configs/controls/no_prior_both_paths.yaml
      config_overrides: {dataset.graph_random_edges_seed: 3046, dataset.metabolite_randomize_seed: 5046}
